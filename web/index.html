<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コマワリ工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>/* VOICE   everyday creative tool: quiet chrome so the manuscript page is the star
   IDEA    a manga artist's desk: manuscript paper with non-photo-blue guides, sumi ink, red pen, screentone
   PICTURE the live manga page, large in the centre, edited in place
   COLOUR  paper white and ink chrome, non-photo blue for guides and selection, one vermilion accent
   TYPE    Dela Gothic One for the name, Zen Kaku Gothic New for the interface
   LAYOUT  tools left, pages and images, page centre, properties right; drawers and a bottom tool strip on phones */
@font-face{font-family:"KW Antique";src:local("Yu Mincho Demibold"),local("YuMincho-Demibold"),local("Hiragino Mincho ProN W6"),local("HiraMinProN-W6"),local("Noto Serif CJK JP Bold"),local("NotoSerifCJKjp-Bold"),local("Noto Serif JP Bold"),local("NotoSerifJP-Bold");unicode-range:U+3000-303F,U+3041-30FF,U+FF01,U+FF1F,U+FF5E}
@font-face{font-family:"KW Antique";src:local("Yu Gothic Bold"),local("YuGothic-Bold"),local("Hiragino Sans W6"),local("HiraginoSans-W6"),local("Hiragino Kaku Gothic ProN W6"),local("HiraKakuProN-W6"),local("Noto Sans CJK JP Bold"),local("NotoSansCJKjp-Bold"),local("Noto Sans JP Bold"),local("NotoSansJP-Bold");unicode-range:U+0020-007E,U+00A0-00FF,U+2000-206F,U+2190-21FF,U+2460-27BF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF02-FF1E,U+FF20-FF5D,U+FF5F-FFEF}
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#16171a);
--ink:light-dark(#141414,#efeee9);
--sub:light-dark(#5c5c57,#a6a59e);
--line:light-dark(#e1e0da,#2d2e33);
--soft:light-dark(#f2f1ec,#202126);
--desk:light-dark(#c8c7c1,#0b0b0d);
--dot:light-dark(rgba(0,0,0,.09),rgba(255,255,255,.06));
--blue:light-dark(#1689d6,#5cb6f5);
--red:light-dark(#e2352a,#ff5a4e);
--shadow:light-dark(0 12px 32px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.55))}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Zen Kaku Gothic New","Yu Gothic UI","Hiragino Sans","Meiryo UI",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
i[data-i],.ic{display:inline-flex;width:20px;height:20px;flex:none}
i[data-i] svg,.ic svg{width:100%;height:100%}
#app{display:grid;height:100%;grid-template-columns:76px 236px minmax(0,1fr) 308px;grid-template-rows:56px minmax(0,1fr);grid-template-areas:"top top top top" "rail left stage right"}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg);z-index:30}
.brand{display:flex;align-items:center;gap:8px;margin-right:4px;white-space:nowrap}
.brand b{font:400 19px/1 "Dela Gothic One","Zen Kaku Gothic New",sans-serif}
.logo{width:28px;height:28px;flex:none}
.proj{display:flex;align-items:center;gap:4px}
#projName{width:clamp(96px,13vw,210px);height:36px;border:1px solid transparent;background:transparent;border-radius:8px;padding:0 9px;font-size:15px}
#projName:hover{border-color:var(--line)}
#projName:focus{outline:none;border-color:var(--blue);background:var(--soft)}
#dirty{width:8px;height:8px;border-radius:50%;background:var(--red);visibility:hidden;flex:none}
#dirty.on{visibility:visible}
.grp{display:flex;align-items:center;gap:2px;padding-left:6px;border-left:1px solid var(--line)}
.sp{flex:1}
.tb,.ib,.zl{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;border:0;background:transparent;border-radius:8px;padding:0 10px;font-size:14px;white-space:nowrap}
.ib{width:40px;padding:0}
.zl{min-width:62px;font-variant-numeric:tabular-nums}
.tb:hover,.ib:hover,.zl:hover{background:var(--soft)}
.tb:disabled,.ib:disabled{opacity:.32;background:transparent}
.ib.ping{color:var(--blue)}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.primary:hover{filter:brightness(1.08)}
#rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-right:1px solid var(--line);background:var(--bg);overflow-y:auto;scrollbar-width:thin}
#rail button{width:66px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:10px;background:transparent;font-size:13px;line-height:1.1;padding:6px 2px;flex:none;white-space:nowrap}
#rail button i{width:22px;height:22px}
#rail button:hover{background:var(--soft)}
#rail button.on{background:var(--ink);color:var(--bg)}
#rail hr{width:42px;border:0;border-top:1px solid var(--line);margin:4px 0;flex:none}
#left{grid-area:left;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;padding:12px 12px 12px}
.pane.pages{flex:0 1 auto;max-height:54%;border-bottom:1px solid var(--line)}
.pane.lib{flex:1 1 auto}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.ph h2{font-size:15px;margin:0}
.muted{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.pagelist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow-y:auto;padding:3px;min-height:64px;align-content:start}
.pg{border:0;padding:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
.pg canvas{width:100%;height:auto;display:block;background:#fff;box-shadow:0 0 0 1px var(--line);border-radius:2px}
.pg.on canvas{box-shadow:0 0 0 2px var(--blue)}
.pg.on{color:var(--ink);font-weight:700}
.btnrow{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.sb{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;white-space:nowrap}
.sb i[data-i]{width:16px;height:16px}
.sb.icon{width:34px;padding:0}
.pages .btnrow .sb:first-child{flex:1}
.sb:hover{background:var(--soft)}
.sb:disabled{opacity:.35;background:var(--bg)}
.sb.danger:hover:not(:disabled){color:var(--red);border-color:var(--red)}
.libgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow-y:auto;align-content:start;flex:1;min-height:80px;padding:3px}
.li{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--soft);box-shadow:0 0 0 1px var(--line);cursor:grab}
.li:hover{box-shadow:0 0 0 2px var(--blue)}
.li img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.li .used{position:absolute;left:5px;bottom:5px;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #fff}
.li .rm{position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:6px;border:0;background:rgba(0,0,0,.62);color:#fff;display:none;align-items:center;justify-content:center;padding:0}
.li .rm .ic{width:15px;height:15px}
.li:hover .rm,.li:focus-within .rm{display:flex}
.empty{font-size:13px;color:var(--sub);border:1.5px dashed var(--line);border-radius:8px;padding:16px 10px;text-align:center;grid-column:1/-1;line-height:1.6}
#stage{grid-area:stage;position:relative;overflow:hidden;background-color:var(--desk);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.6px);background-size:12px 12px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#status{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;pointer-events:none}
#status span{background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--sub);max-width:100%;line-height:1.45}
#status #sample{color:var(--ink);border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
#inlineEd{position:absolute;z-index:6;width:270px;min-height:100px;padding:10px 12px;border-radius:10px;border:2px solid var(--blue);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;resize:both;box-shadow:var(--shadow)}
#inlineEd:focus{outline:none}
#right{grid-area:right;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--bg);min-height:0}
.rtabs{display:flex;border-bottom:1px solid var(--line);padding:0 10px;flex:none}
.rtab{flex:1;height:46px;border:0;background:transparent;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.rtab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.rbody{flex:1;overflow-y:auto;padding:2px 16px 28px;scrollbar-width:thin}
.rbody[hidden]{display:none}
.phead{padding:14px 0 6px}
.phead h2{margin:0;font-size:19px;line-height:1.2}
.phead p{margin:3px 0 0;color:var(--sub);font-size:13px}
.psec{padding:12px 0 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.psec:last-child{border-bottom:0}
.psec h3{margin:0;font-size:13px;color:var(--sub);font-weight:700}
.field{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:8px}
.field>label{font-size:13px;color:var(--sub);line-height:1.3}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two .field{grid-template-columns:minmax(0,1fr);gap:3px}
.form{display:flex;flex-direction:column;gap:12px}
.form .field{grid-template-columns:110px minmax(0,1fr)}
.form .two .field{grid-template-columns:minmax(0,1fr)}
input[type=number],input[type=text],select,textarea{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:0 10px;font-size:15px}
textarea{height:auto;padding:8px 10px;line-height:1.55;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--bg)}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:3px 4px;background:var(--soft);cursor:pointer}
.rng{display:flex;align-items:center;gap:8px}
.rng output{min-width:50px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
input[type=range]{flex:1;width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);margin-top:-7px;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--bg)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;height:36px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;white-space:nowrap}
.seg button:hover{background:var(--soft)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;min-height:32px;line-height:1.35}
.chk input{width:18px;height:18px;accent-color:var(--ink);margin:0;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.pb{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;white-space:nowrap}
.pb:hover{background:var(--soft)}
.pb .ic{width:16px;height:16px}
.pb.wide{width:100%;height:42px;font-size:14px}
.pb.strong{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.pb.strong:hover{filter:brightness(1.15)}
.pb.danger{color:var(--red)}
.pb.danger:hover{border-color:var(--red)}
.note{font-size:13px;color:var(--sub);margin:0;line-height:1.55}
.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shape{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;white-space:nowrap}
.shape:hover{background:var(--soft)}
.shape canvas{width:46px;height:30px}
.shape.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.imgrow{display:flex;gap:10px;align-items:center}
.imgrow img{width:56px;height:56px;object-fit:cover;border-radius:6px;box-shadow:0 0 0 1px var(--line);flex:none}
.imgname{font-size:13px;overflow-wrap:anywhere;color:var(--sub)}
.tips{margin:0;padding-left:18px;font-size:13px;color:var(--sub);display:grid;gap:5px;line-height:1.5}
.tips b{color:var(--ink);font-weight:700}
.lyr{display:flex;align-items:center;gap:2px;padding:0 4px;border-radius:8px;min-height:42px}
.lyr:hover{background:var(--soft)}
.lyr.on{background:color-mix(in srgb,var(--blue) 15%,transparent)}
.lyr .nm{flex:1;border:0;background:transparent;text-align:left;font-size:14px;padding:8px 4px;display:flex;align-items:center;gap:8px;overflow:hidden}
.lyr .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lyr .nm small{color:var(--sub);font-size:13px;flex:none;margin-left:auto}
.lyr .ib{width:34px;height:34px}
.lyr .ib .ic{width:17px;height:17px}
.lyr.off .nm{opacity:.45}
.lhead{font-size:13px;color:var(--sub);font-weight:700;margin:16px 0 4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.46);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{width:min(740px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 6px 20px}
.mh h2{margin:0;font-size:21px;line-height:1.2}
.mb{padding:6px 20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.mf .pb{height:40px;padding:0 16px;font-size:14px}
.tpls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tpls{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.tpls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tpl{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px}
.tpl:hover{border-color:var(--ink);background:var(--soft)}
.tpl canvas{width:72px;height:auto;box-shadow:0 0 0 1px var(--line);background:#fff}
.kv{font-size:14px;margin:0;font-variant-numeric:tabular-nums}
.warn{color:var(--red);font-size:13px;margin:0}
.warn:empty{display:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;z-index:80;transition:opacity .2s,transform .2s;max-width:min(560px,calc(100% - 32px));text-align:center;line-height:1.5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:90;background:rgba(10,10,12,.5);display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:16px}
#busy[hidden]{display:none}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#toast,#left,#right{transition:none}.spin{animation-duration:2.4s}}
.only-narrow,.only-narrow2{display:none}
@media (max-width:1180px){
#app{grid-template-columns:76px minmax(0,1fr) 300px;grid-template-areas:"top top top" "rail stage right"}
#left{position:fixed;top:56px;bottom:0;left:76px;width:260px;z-index:25;transform:translateX(-120%);visibility:hidden;transition:transform .2s,visibility .2s;box-shadow:var(--shadow)}
body.show-left #left{transform:none;visibility:visible}
.only-narrow{display:inline-flex}
.tb span{display:none}
.tb{width:40px;padding:0}
}
@media (max-width:760px){
#app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr) auto;grid-template-areas:"top" "stage" "rail"}
#rail{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:2px}
#rail hr{width:0;height:40px;border:0;border-left:1px solid var(--line);margin:0 3px}
#rail button{width:62px}
#left{left:0;width:min(280px,86vw)}
#right{position:fixed;top:56px;bottom:0;right:0;width:min(340px,92vw);z-index:25;transform:translateX(120%);visibility:hidden;transition:transform .2s,visibility .2s;box-shadow:var(--shadow)}
body.show-right #right{transform:none;visibility:visible}
.only-narrow2{display:inline-flex}
.brand b,.grp.zoom{display:none}
.primary span{display:none}
.primary{width:44px;padding:0}
#top{gap:2px;padding:0 6px}
.grp{padding-left:2px;border-left:0}
}
@media (max-width:900px){#status #hint{display:none}}
@media (max-width:520px){.proj{display:none}}
@media (pointer:coarse){input[type=number],input[type=text],select,textarea{font-size:16px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib only-narrow" id="bLeft" type="button" title="ページと画像" aria-label="ページと画像"><i data-i="pages"></i></button>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="4" fill="var(--ink)"/><path d="M6.5 6.5h19v8H6.5z" fill="var(--bg)"/><path d="M6.5 17.5h9.2l-2.6 8H6.5z" fill="var(--bg)"/><path d="M18.8 17.5h6.7v8h-9.3z" fill="var(--red)"/></svg>
      <b>コマワリ工房</b>
    </div>
    <div class="proj"><input id="projName" type="text" aria-label="作品名" spellcheck="false" autocomplete="off"><span id="dirty" title="保存していない変更があります"></span></div>
    <div class="grp">
      <button class="tb" id="bNew" type="button" title="新しい作品"><i data-i="new"></i><span>新規</span></button>
      <button class="tb" id="bOpen" type="button" title="作品ファイルを開く (Ctrl+O)"><i data-i="open"></i><span>開く</span></button>
      <button class="tb" id="bSave" type="button" title="作品をファイルに保存 (Ctrl+S)"><i data-i="save"></i><span>保存</span></button>
    </div>
    <div class="grp hist">
      <button class="ib" id="bUndo" type="button" title="元に戻す (Ctrl+Z)" aria-label="元に戻す"><i data-i="undo"></i></button>
      <button class="ib" id="bRedo" type="button" title="やり直す (Ctrl+Y)" aria-label="やり直す"><i data-i="redo"></i></button>
    </div>
    <div class="sp"></div>
    <div class="grp zoom">
      <button class="ib" id="bZout" type="button" title="縮小" aria-label="縮小"><i data-i="zoomout"></i></button>
      <button class="zl" id="bZfit" type="button" title="ページ全体を表示 (Ctrl+0)">100%</button>
      <button class="ib" id="bZin" type="button" title="拡大" aria-label="拡大"><i data-i="zoomin"></i></button>
    </div>
    <button class="primary" id="bExport" type="button" title="画像として書き出し (Ctrl+E)"><i data-i="export"></i><span>書き出し</span></button>
    <button class="ib only-narrow2" id="bRight" type="button" title="プロパティ" aria-label="プロパティ"><i data-i="sliders"></i></button>
  </header>

  <nav id="rail" aria-label="ツール">

  let P = null;
  try { P = normalizeProject(o); } catch (err) { P = null; }
  if (!P) { project = prev; throw new Error('invalid'); }
  project = P; clearCaches();
  await registerFonts(P.fonts);
  await Promise.all(Object.keys(P.assets).map(id => loadAssetImage(id)));
  ed.pi = 0; ed.sel = null; ed.inline = null; inlineEd.hidden = true;
  resetHistory(); refreshAll(); fitView();
}

/* ================= export ================= */
function openExport() {
  if (!project) return;
  closeInline(); flushCommit();
  const W = project.page.w, H = project.page.h, n = project.pages.length, mm = project.page.mm;
  const st = ed.exp || (ed.exp = { scope: 'page', fmt: 'png', width: W, q: 0.92, transparent: false });
  if (n < 2) st.scope = 'page';
  const wI = el('input', { type: 'number', id: 'x-w', min: '16', max: '30000' }), hI = el('input', { type: 'number', id: 'x-h', min: '16', max: '30000' });
  const info = el('p', { class: 'kv' }), warn = el('p', { class: 'warn' });
  const upd = () => {
    const w = Math.max(1, Math.round(st.width)), h = Math.max(1, Math.round(st.width * H / W)), mp = w * h / 1e6;
    info.textContent = '出力：' + w.toLocaleString() + ' × ' + h.toLocaleString() + ' px（' + mp.toFixed(1) + 'メガピクセル）' + (mm ? '／' + mm[0] + '×' + mm[1] + 'mmで約' + Math.round(w / (mm[0] / 25.4)) + 'dpi' : '');
    warn.textContent = w > 16384 || h > 16384 || mp > 200 ? '大きすぎるため書き出せない場合があります（目安：一辺16,384px・2億画素まで）。' : '';
  };
  const setW = w => { st.width = Math.max(16, Math.round(w)); wI.value = String(st.width); hI.value = String(Math.round(st.width * H / W)); upd(); };
  wI.addEventListener('input', () => { const v = parseFloat(wI.value); if (v > 0) { st.width = v; hI.value = String(Math.round(v * H / W)); upd(); } });
  hI.addEventListener('input', () => { const v = parseFloat(hI.value); if (v > 0) { st.width = v * W / H; wI.value = String(Math.round(st.width)); upd(); } });
  const qRow = field('画質', range(st, 'q', { id: 'xq', min: 0.5, max: 1, step: 0.01, pct: true, silent: true }));
  const tRow = chk(st, 'transparent', 'コマの外側（余白）を透明にする', { id: 'xt', silent: true });
  const vis = () => { qRow.hidden = st.fmt === 'png'; tRow.hidden = st.fmt === 'jpeg'; };
  const body = el('div', { class: 'form' },
    n > 1 ? field('対象', seg(st, 'scope', [['page', 'このページ（' + (ed.pi + 1) + '）'], ['all', '全' + n + 'ページ（ZIP）']], { id: 'xscope', silent: true })) : null,
    field('形式', seg(st, 'fmt', [['png', 'PNG'], ['jpeg', 'JPEG'], ['webp', 'WebP']], { id: 'xfmt', silent: true, on: vis })),
    el('div', { class: 'two' }, field('幅 px', wI), field('高さ px', hI)),
    el('div', { class: 'btns' }, [0.5, 1, 2, 3, 4].map(k => btn('×' + k, () => setW(W * k)))),
    el('div', { class: 'btns' }, btn('幅1080px', () => setW(1080)), btn('幅2048px', () => setW(2048)), btn('幅3840px（4K）', () => setW(3840)),
      mm ? btn('印刷用 350dpi', () => setW(mm[0] / 25.4 * 350)) : null, mm ? btn('印刷用 600dpi', () => setW(mm[0] / 25.4 * 600)) : null),
    info, warn, qRow, tRow,
    note('文字・吹き出し・効果線はベクターで描き直すので、大きくしてもにじみません。読み込んだ画像は元の解像度までがきれいに出ます。'));
  setW(st.width); vis();
  openModal('画像として書き出し', body, [{ label: 'キャンセル', onClick: closeModal }, { label: '書き出す', primary: true, onClick: () => { closeModal(); runExport(st); } }]);
}
async function runExport(st) {
  const idxs = st.scope === 'all' ? project.pages.map((_, i) => i) : [ed.pi];
  const W = project.page.w, H = project.page.h, w = Math.max(1, Math.round(st.width)), h = Math.max(1, Math.round(st.width * H / W));
  const mime = { png: 'image/png', jpeg: 'image/jpeg', webp: 'image/webp' }[st.fmt] || 'image/png';
  busy(true, '書き出し中…');
  try {
    await prepareRender(idxs);
    const files = [];
    for (const i of idxs) {
      busy(true, idxs.length > 1 ? '書き出し中… ' + (files.length + 1) + ' / ' + idxs.length : '書き出し中…');
      await sleep(30);
      const blob = await renderToBlob(project.pages[i], w, h, mime, st.q, st.transparent && st.fmt !== 'jpeg');
      if (!blob) throw new Error('mem');
      const ext = blob.type === 'image/jpeg' ? 'jpg' : blob.type === 'image/webp' ? 'webp' : 'png';
      files.push({ name: safeName(project.name) + '_p' + String(i + 1).padStart(2, '0') + '.' + ext, blob });
    }
    if (files.length === 1) { busy(false); await saveBlob(files[0].name, files[0].blob); }
    else { busy(true, 'ZIPにまとめています…'); const zip = await makeZip(files); busy(false); await saveBlob(safeName(project.name) + '.zip', zip); }
  } catch (err) {
    console.error(err);
    toast(err && err.message === 'mem' ? 'メモリが足りず書き出せませんでした。解像度を下げてお試しください' : '書き出しに失敗しました', 4500);
  } finally { busy(false); }
}
async function prepareRender(idxs) {
  const ids = new Set(), items = [];
  for (const i of idxs) {
    const pg = project.pages[i];
    for (const pn of pg.panels) if (pn.img) ids.add(pn.img.asset);
    for (const it of pg.items) { if (it.type === 'image') ids.add(it.asset); if ((it.type === 'bubble' || it.type === 'text') && it.text) items.push(it); }
  }
  await Promise.all([...ids].map(loadAssetImage));
  if (document.fonts && document.fonts.load) {
    await Promise.race([Promise.all(items.map(it => ensureWebFont(fontSpec(it.font)))), sleep(5000)]);
    await Promise.race([Promise.all(items.map(it => document.fonts.load(fontString(it, 32), it.text).catch(() => {}))), sleep(8000)]);
  }
  layoutCache.clear();
  for (const i of idxs) for (const it of project.pages[i].items) if (it.type === 'bubble' && it.autoFit) fitBubble(it);
}
async function renderToBlob(page, w, h, mime, q, transparent) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  if (!x) return null;
  x.setTransform(w / project.page.w, 0, 0, h / project.page.h, 0, 0);
  renderPage(x, page, { transparent: !!transparent });
  const blob = await new Promise(r => { try { c.toBlob(r, mime, q); } catch (err) { r(null); } });
  c.width = c.height = 1;
  return blob;
}
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [], now = new Date();
  const time = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF, date = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  let offset = 0;
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()), name = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true); lh.setUint16(10, time, true); lh.setUint16(12, date, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true); cd.setUint16(10, 0, true); cd.setUint16(12, time, true); cd.setUint16(14, date, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, name.length, true);
    cd.setUint16(30, 0, true); cd.setUint16(32, 0, true); cd.setUint16(34, 0, true); cd.setUint16(36, 0, true); cd.setUint32(38, 0, true); cd.setUint32(42, offset, true);
    central.push(cd.buffer, name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((s, b) => s + b.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

/* ================= autosave (this browser only) ================= */
let idbConn = null, autoTimer = 0;
function idbOpen() {
  if (idbConn) return Promise.resolve(idbConn);
  return new Promise((res, rej) => {
    try { const r = indexedDB.open('komawari', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => { idbConn = r.result; res(idbConn); }; r.onerror = () => rej(r.error); }
    catch (err) { rej(err); }
  });
}
async function idbGet(k) { const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('kv', 'readonly').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
const idbAssets = new Set();
function scheduleAutosave() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(async () => {
    if (!project) return;
    try {
      const ids = Object.keys(project.assets);
      for (const id of ids) if (!idbAssets.has(id)) { await idbSet('a:' + id, project.assets[id]); idbAssets.add(id); }
      const d = projectData(); d.assets = {};
      await idbSet('autosave', { at: Date.now(), sample: ed.isSample && ed.changes === 0, assetIds: ids, project: d });
      await pruneAssets(ids);
    } catch (err) { }
  }, 1500);
}
async function pruneAssets(ids) {
  const keep = new Set(ids), db = await idbOpen();
  const keys = await new Promise((res, rej) => { const q = db.transaction('kv', 'readonly').objectStore('kv').getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  const dead = keys.filter(k => typeof k === 'string' && k.startsWith('a:') && !keep.has(k.slice(2)));
  if (!dead.length) return;
  await new Promise(res => { const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv'); for (const k of dead) st.delete(k); tx.oncomplete = res; tx.onerror = res; });
  for (const k of dead) idbAssets.delete(k.slice(2));
}
async function loadAutosave() {
  const rec = await idbGet('autosave');
  if (!rec || !rec.project) return null;
  const P = rec.project;
  if (Array.isArray(rec.assetIds)) {
    P.assets = {};
    for (const id of rec.assetIds) { const a = await idbGet('a:' + id).catch(() => null); if (a) { P.assets[id] = a; idbAssets.add(id); } }
  }
  return rec;
}

/* ================= sample page ================= */
function buildSample() {
  project = newProject('B5', 'サンプル　コマワリ工房へようこそ');
  const page = newPage();
  project.pages.push(page);
  applyTemplate(page, 6);
  const [p1, p2, p3, p4, p5] = readingOrder(page.panels), u = U(), bw = project.layout.bw;
  const bb = pn => polyBBox(pn.pts), full = pn => { const b = bb(pn); return { cx: b.cx, cy: b.cy, w: b.w + bw * 2, h: b.h + bw * 2 }; };
  const b1 = bb(p1), b2 = bb(p2), b3 = bb(p3), b4 = bb(p4), b5 = bb(p5);
  page.items.push(makeEffect('tone', full(p1), p1.id, { pattern: 'grad', dens: 0.5, d2: 0, gang: 90, pitch: Math.round(0.75 * u) }));
  page.items.push(makeEffect('focus', full(p3), p3.id, { fx: -0.46, fy: 0.02, ir: 0.3, count: 220 }));
  page.items.push(makeEffect('speed', full(p4), p4.id, { count: 64 }));
  page.items.push(makeEffect('flash', { cx: b5.cx, cy: b5.cy, w: b5.w * 0.94, h: b5.h * 0.9 }, p5.id, { ir: 0.42, count: 80 }));
  const bub = (x, y, o, tip) => { const b = makeBubble(x, y, o); if (tip) { b.tail.x = tip[0]; b.tail.y = tip[1]; } else b.tail.on = false; page.items.push(b); return b; };
  page.items.push(makeText(b1.x + b1.w * 0.13, b1.y + b1.h * 0.3, { text: 'とある\n工房にて', font: 'mincho', bold: false, size: Math.round(1.7 * u), bg: '#ffffff' }));
  bub(b1.x2 - b1.w * 0.26, b1.cy + u, { text: 'ようこそ\nコマワリ工房へ' }, [-5 * u, 15 * u]);
  bub(b2.x + b2.w * 0.6, b2.y + b2.h * 0.4, { text: '画像は\nコマへ\nドロップ…', shape: 'cloud', tail: { style: 'thought' } }, [-7 * u, 13 * u]);
  page.items.push(makeSfx(b3.x + b3.w * 0.25, b3.cy, { text: 'ドンッ', rot: -9 }));
  bub(b3.x2 - b3.w * 0.2, b3.cy - u, { text: '効果線も\n描き文字も\nおまかせ！', shape: 'spike' }, [-10 * u, 11 * u]);
  bub(b4.cx, b4.cy - 2 * u, { text: 'ダブルクリックで\nセリフを編集', shape: 'round' }, [2 * u, 17 * u]);
  bub(b5.cx, b5.cy, { text: '好きな解像度で\n書き出せる！' }, null);
  ed.isSample = true; ed.pi = 0; ed.sel = null;
  clearCaches(); resetHistory();
}

/* ================= boot ================= */
let started = false;
async function start(data) {
  if (started) return;
  started = true;
  wireUI(); initDownloads();
  let ok = false;
  if (data && data.project) {
    try { await loadProjectObject(data.project); ed.pi = clamp(data.pi | 0, 0, project.pages.length - 1); ed.isSample = !!data.sample; ok = true; } catch (err) { }
  }
  if (!ok) {
    try {
      const rec = await Promise.race([loadAutosave(), sleep(4000).then(() => null)]);
      if (rec && rec.project) { await loadProjectObject(rec.project); ok = true; ed.isSample = !!rec.sample; if (!rec.sample) toast('前回の作業を復元しました（このブラウザ内の一時保存です）', 4000); }
    } catch (err) { }
  }
  if (!ok) buildSample();
  $('#sample').hidden = !ed.isSample;
  refreshAll(); fitView();
  try { const hot = window.claude && window.claude.hot; if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => project ? { pi: ed.pi, sample: ed.isSample && ed.changes === 0, project: projectData() } : {}); } catch (err) { }
}
{
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
}

})();
